<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Home & Garden Guide | iBCB</title>
  <meta name="description" content="Thank you for requesting Home & Garden Guide.">

  <style>
    :root {
      --primary-color: #0B3D91;
      --secondary-color: #D4AF37;
      --dark-color: #111827;
      --light-color: #f9fafb;
      --text-color: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-color);
      color: var(--text-color);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 760px;
      background: #ffffff;
      border-radius: 24px;
      padding: 50px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      color: var(--primary-color);
      margin-bottom: 24px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.14);
      color: var(--dark-color);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.12;
      color: var(--dark-color);
      margin: 0 0 18px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 26px;
    }

    .buttons {
      display: grid;
      gap: 14px;
      max-width: 420px;
      margin: 32px auto 0;
    }

    a.button {
      display: block;
      text-decoration: none;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
    }

    .primary {
      color: #ffffff;
      background: var(--primary-color);
    }

    .secondary {
      color: var(--dark-color);
      background: rgba(212, 175, 55, 0.18);
      border: 1px solid rgba(212, 175, 55, 0.35);
    }

    .store {
      color: #ffffff;
      background: var(--secondary-color);
    }

    .small-note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 28px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 34px 24px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="brand">iBCB</div>

      <div class="badge">Home & Garden</div>

      <h1>Thank you!</h1>

      <p>
        Your free <strong>Home & Garden Guide</strong> is ready.
        You can download it below.
      </p>

      <div class="buttons">
        <a class="button primary" href="https://ibcb-a.com/bcb1_pdf/Home_Garden/home_garden_guide_E.pdf" target="_blank" rel="noopener">
          Download English Guide
        </a>

        <a class="button secondary" href="https://ibcb-a.com/bcb1_pdf/Home_Garden/home_garden_guide_FR1.pdf" target="_blank" rel="noopener">
          Télécharger le guide français
        </a>

        <a class="button store" href="https://ibcb-a.com/product-category/home-garden/" target="_blank" rel="noopener">
          Visit Home & Garden Products
        </a>
      </div>

      <p class="small-note">
        Campaign: homegarden_guide
      </p>
    </section>
  </main>
</body>
</html>
