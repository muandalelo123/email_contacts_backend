<!DOCTYPE html>
<html lang="{{LANGUAGE_DEFAULT}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{{GUIDE_TITLE}} | iBCB</title>
  <meta name="description" content="{{SUBTITLE}}">

  <style>
    :root {
      --primary-color: {{PRIMARY_COLOR}};
      --secondary-color: {{SECONDARY_COLOR}};
      --dark-color: #111827;
      --light-color: #f9fafb;
      --text-color: #374151;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--light-color);
      color: var(--text-color);
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
    }

    .content {
      padding: 56px;
    }

    .brand {
      font-size: 28px;
      font-weight: 700;
      font-style: italic;
      color: var(--primary-color);
      margin-bottom: 30px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.14);
      color: var(--dark-color);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 44px;
      line-height: 1.08;
      color: var(--dark-color);
      margin: 0 0 18px;
    }

    .subtitle {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    form {
      display: grid;
      gap: 14px;
      max-width: 460px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 16px 20px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      color: #ffffff;
      background: var(--primary-color);
    }

    button:hover {
      opacity: 0.92;
    }

    .small-note {
      font-size: 13px;
      color: #6b7280;
      margin-top: 14px;
      max-width: 460px;
    }

    .visual {
      background: linear-gradient(145deg, var(--primary-color), var(--secondary-color));
      color: white;
      padding: 56px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .guide-card {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 22px;
      padding: 34px;
      backdrop-filter: blur(8px);
    }

    .guide-card h2 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    .guide-card p {
      font-size: 16px;
      line-height: 1.6;
      margin: 0;
    }

    .category {
      margin-top: 28px;
      font-size: 15px;
      opacity: 0.9;
    }

    @media (max-width: 840px) {
      .container {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 36px 24px;
      }

      h1 {
        font-size: 34px;
      }

      .visual {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="container">
      <div class="content">
        <div class="brand">iBCB</div>

        <div class="badge">{{CATEGORY_NAME}}</div>

        <h1>{{HEADLINE}}</h1>

        <p class="subtitle">{{SUBTITLE}}</p>

        <form action="{{LEAD_CAPTURE_URL}}" method="POST">
          <input type="hidden" name="funnel_id" value="{{FUNNEL_ID}}">
          <input type="hidden" name="utm_campaign" value="{{UTM_CAMPAIGN}}">
          <input type="hidden" name="source" value="landing_page">
          <input type="hidden" name="language" value="{{LANGUAGE_DEFAULT}}">
          <input type="hidden" name="thankyou_url" value="{{THANKYOU_URL}}">

          <input type="text" name="name" placeholder="Your name" required>
          <input type="email" name="email" placeholder="Your email" required>

          <button type="submit">{{CTA_TEXT}}</button>
        </form>

        <p class="small-note">
          By submitting this form, you agree to receive the requested guide and related iBCB updates.
        </p>
      </div>

      <div class="visual">
        <div class="guide-card">
          <h2>{{GUIDE_TITLE}}</h2>
          <p>{{SUBTITLE}}</p>
          <div class="category">Campaign: {{UTM_CAMPAIGN}}</div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
